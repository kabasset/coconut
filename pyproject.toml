[project]
name = "coconut"
version = "0.1"
authors = [
  {name="Basset, Antoine", email = "antoine.basset@cnes.fr"},
  {name="Doucet,Aloïs"},
  {name="Palacin, Hugo"}
]
description = "Data processing organization CO2 footprint estimator"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "Apache-2.0"
license-files = ["LICEN[CS]E*"]
dependencies = [
    "numpy >= 2.0",
    "astropy", # QTable
    "geopy",
    "pandas",
    "plotly",
    "python-jsonpath"
]

[dependency-groups]
dev = [
  "pytest",
  "sphinx",
  "sphinxawesome-theme",
  "sphinx-changelog",
  "sphinxcontrib-images",
  "sphinxcontrib-plantuml",
  "sphinxcontrib-video",
  "gitpython",
]

[project.urls]
homepage = "https://github.com/kabasset/coconut"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[project.scripts]
timeo = "coconut.client:run"
